name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Lazarus
      shell: powershell
      run: |
        choco install lazarus -y
        
    - name: Clone Cheat Engine source
      shell: powershell
      run: |
        git clone --depth 1 https://github.com/cheat-engine/cheat-engine.git
        
    - name: Copy custom units
      shell: powershell
      run: |
        Copy-Item src\*.pas "cheat-engine\Cheat Engine\" -Force
        
    - name: Debug - List files
      shell: powershell
      run: |
        Get-ChildItem -Name | Select-Object -First 20
        Get-ChildItem "cheat-engine\Cheat Engine" -Filter "*.pas" | Select-Object -First 10 Name
        
    - name: Build
      shell: powershell
      run: |
        & lazbuild CheatEngineEasyTrainer.lpi -B 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Build failed with exit code: $LASTEXITCODE"
          exit 1
        }
        
    - name: Check build output
      shell: powershell
      run: |
        if (Test-Path bin\CEEasyTrainer.exe) {
          Write-Host "Build SUCCESS - exe found"
        } else {
          Write-Host "Build FAILED - exe not found"
          exit 1
        }
        
    - name: Package release
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path release
        Copy-Item bin\CEEasyTrainer.exe release\ -ErrorAction SilentlyContinue
        Copy-Item README.md release\ -ErrorAction SilentlyContinue
        Copy-Item docs release\ -Recurse -ErrorAction SilentlyContinue
        
    - name: Create artifact
      uses: actions/upload-artifact@v4
      with:
        name: CE-Easy-Trainer-Windows
        path: release/
        
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
