name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Lazarus
      shell: powershell
      run: |
        choco install lazarus -y
        
    - name: Build
      shell: powershell
      run: |
        $lazbuild = "C:\lazarus\lazbuild.exe"
        if (!(Test-Path $lazbuild)) {
          $lazbuild = (Get-Command lazbuild -ErrorAction SilentlyContinue).Source
        }
        Write-Host "Using lazbuild: $lazbuild"
        & $lazbuild CEEasyTrainer.lpi -B 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Build failed with exit code: $LASTEXITCODE"
          exit 1
        }
        
    - name: Verify build
      shell: powershell
      run: |
        if (Test-Path bin\CEEasyTrainer.exe) {
          $size = (Get-Item bin\CEEasyTrainer.exe).Length / 1KB
          Write-Host "Build SUCCESS - exe size: $([math]::Round($size, 2)) KB"
        } else {
          Write-Host "Build FAILED - exe not found"
          exit 1
        }
        
    - name: Package release
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path release
        Copy-Item bin\CEEasyTrainer.exe release\
        Copy-Item README.md release\ -ErrorAction SilentlyContinue
        
    - name: Create artifact
      uses: actions/upload-artifact@v4
      with:
        name: CE-Easy-Trainer-Windows
        path: release/
        
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
