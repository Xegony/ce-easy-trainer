name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Lazarus (retry)
      shell: powershell
      run: |
        $ok = $false
        for ($i=1; $i -le 4; $i++) {
          Write-Host "Install Lazarus attempt $i ..."
          choco install lazarus -y --no-progress
          if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          Start-Sleep -Seconds (20 * $i)
        }
        if (-not $ok) {
          Write-Host "Failed to install Lazarus after retries"
          exit 1
        }

    - name: Build with lazbuild
      shell: powershell
      run: |
        $lazbuild = "C:\lazarus\lazbuild.exe"
        if (!(Test-Path $lazbuild)) {
          $lazbuild = (Get-Command lazbuild -ErrorAction SilentlyContinue).Source
        }
        if (!(Test-Path $lazbuild)) {
          Write-Host "lazbuild not found"
          exit 1
        }
        Write-Host "Using lazbuild: $lazbuild"

        New-Item -ItemType Directory -Force -Path bin | Out-Null
        & $lazbuild CEEasyTrainer.lpi -B 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Build failed with exit code: $LASTEXITCODE"
          exit 1
        }

    - name: Verify build
      shell: powershell
      run: |
        if (Test-Path bin\CEEasyTrainer.exe) {
          $size = (Get-Item bin\CEEasyTrainer.exe).Length / 1KB
          Write-Host "Build SUCCESS - exe size: $([math]::Round($size, 2)) KB"
        } else {
          Write-Host "Build FAILED - exe not found"
          exit 1
        }

    - name: Package release
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path release | Out-Null
        Copy-Item bin\CEEasyTrainer.exe release\
        Copy-Item README.md release\ -ErrorAction SilentlyContinue

    - name: Create artifact
      uses: actions/upload-artifact@v4
      with:
        name: CE-Easy-Trainer-Windows
        path: release/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
