name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Lazarus (retry)
      shell: powershell
      run: |
        $ok = $false
        for ($i=1; $i -le 4; $i++) {
          Write-Host "Install Lazarus attempt $i ..."
          choco install lazarus -y --no-progress
          if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          Start-Sleep -Seconds (20 * $i)
        }
        if (-not $ok) {
          Write-Host "Failed to install Lazarus after retries"
          exit 1
        }

    - name: Build GUI version
      shell: powershell
      run: |
        $lazbuild = "C:\lazarus\lazbuild.exe"
        Write-Host "Using lazbuild: $lazbuild"

        New-Item -ItemType Directory -Force -Path bin | Out-Null
        
        # Build GUI version
        if (Test-Path CEEasyTrainerGUI.lpi) {
          Write-Host "Building GUI version..."
          & $lazbuild CEEasyTrainerGUI.lpi -B 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GUI build SUCCESS"
          } else {
            Write-Host "GUI build failed, falling back to console..."
            & $lazbuild CEEasyTrainer.lpi -B 2>&1
          }
        } else {
          Write-Host "Building console version..."
          & $lazbuild CEEasyTrainer.lpi -B 2>&1
        }
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Build failed with exit code: $LASTEXITCODE"
          exit 1
        }

    - name: Verify build
      shell: powershell
      run: |
        $exe = $null
        if (Test-Path bin\CEEasyTrainerGUI.exe) { $exe = "bin\CEEasyTrainerGUI.exe" }
        elseif (Test-Path bin\CEEasyTrainer.exe) { $exe = "bin\CEEasyTrainer.exe" }
        
        if ($exe) {
          $size = (Get-Item $exe).Length / 1KB
          Write-Host "Build SUCCESS: $exe - size: $([math]::Round($size, 2)) KB"
        } else {
          Write-Host "Build FAILED - exe not found"
          exit 1
        }

    - name: Package release
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path release | Out-Null
        if (Test-Path bin\CEEasyTrainerGUI.exe) {
          Copy-Item bin\CEEasyTrainerGUI.exe release\
        }
        if (Test-Path bin\CEEasyTrainer.exe) {
          Copy-Item bin\CEEasyTrainer.exe release\
        }
        Copy-Item README.md release\ -ErrorAction SilentlyContinue

    - name: Create artifact
      uses: actions/upload-artifact@v4
      with:
        name: CE-Easy-Trainer-Windows
        path: release/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
